# ---- wander
- id: 06-downtown
  name: Downtown on foot
  category: Wander
  area: Clayton, Washington and College
  note: A few blocks of 1800s brick storefronts, painted signs and record shops.
  map: Clayton Street and College Avenue, Athens, GA

- id: 07-morton-theatre
  name: Morton Theatre
  category: Wander
  area: West Washington Street
  note: A 1910 vaudeville theatre built by Black businessman Pink Morton, and still a working stage.
  map: Morton Theatre, Athens, GA

- id: 08-botanical-garden-trails
  name: State Botanical Garden trails
  category: Wander
  area: South Milledge Avenue
  note: Woodland and river trails around our wedding venue, worth a wander while you’re in town.
  map: State Botanical Garden of Georgia, Athens, GA

